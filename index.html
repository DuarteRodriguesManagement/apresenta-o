let year=-1,step=0;const tabs=['Estratégia','Decisões','Resultados','Erros'];const $=s=>document.querySelector(s);const f=(v,n=1)=>Number(v).toLocaleString('pt-PT',{minimumFractionDigits:n,maximumFractionDigits:n});
